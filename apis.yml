name: Execthread
description: >-
  ExecThread is a selective, invitation-based network where successful executives
  discreetly share confidential, recruiter-led job opportunities with one another
  that are not posted on public job boards. The membership platform matches vetted
  senior professionals with unadvertised executive-level roles, offers executive
  branding services and resume review, and runs a points-based referral economy for
  members who contribute opportunities. Founded as a private career marketplace, it
  has been recognized on the Inc. 5000 and by the Financial Times. It is catalogued
  in the API Evangelist network as a portfolio company of Canaan Partners; it exposes
  no public API or developer surface as of this profile.
